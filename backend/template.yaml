  StartExamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.startExam
      MemorySize: 512
      Events:
        StartExamApi:
          Type: Api
          Properties:
            RestApiId: !Ref CloudExamApi
            Path: /exams/start
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${TablePrefix}-exam-sessions'
        # Upgraded from Read to Crud for Spanish translation cache writes (Req 7.3, 12.2)
        - DynamoDBCrudPolicy:
            TableName: !Sub '${TablePrefix}-questions'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${TablePrefix}-alternatives'
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-enrollments'
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-courses'
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-exam-results'
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-exam-results/index/*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-enrollments/index/*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-exam-sessions/index/*'
        # Amazon Translate permissions (Req 14.1). Resource-level scoping is not supported
        # for TranslateText; we scope by narrow action list only (no translate:* wildcard, Req 14.4).
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
              Resource: '*'

