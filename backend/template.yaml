AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Exam Platform - Serverless Backend (Added incorrectExplanation support)

# Global configuration for all functions
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        JWT_SECRET: !Ref JWTSecret
        JWT_EXPIRATION: !Ref JWTExpiration
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        COGNITO_REGION: !Ref AWS::Region
        DYNAMODB_TABLE_PREFIX: !Ref TablePrefix
        S3_BUCKET_NAME: !Ref ImageBucket
        S3_REGION: !Ref AWS::Region
        USERS_TABLE: !Sub '${TablePrefix}-users'
        STUDENTS_TABLE: !Sub '${TablePrefix}-students'
        COURSES_TABLE: !Sub '${TablePrefix}-courses'
        QUESTIONS_TABLE: !Sub '${TablePrefix}-questions'
        QUESTION_HISTORY_TABLE: !Sub '${TablePrefix}-question-history'
        ALTERNATIVES_TABLE: !Sub '${TablePrefix}-alternatives'
        ENROLLMENTS_TABLE: !Sub '${TablePrefix}-enrollments'
        EXAM_SESSIONS_TABLE: !Sub '${TablePrefix}-exam-sessions'
        ANSWERS_TABLE: !Sub '${TablePrefix}-answers'
        EXAM_RESULTS_TABLE: !Sub '${TablePrefix}-exam-results'
        SYSTEM_CONFIG_TABLE: !Sub '${TablePrefix}-system-config'
        DEPLOYMENT_VERSION: "3.12"
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

# Parameters for deployment configuration
Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment

  JWTSecret:
    Type: String
    NoEcho: true
    Description: Secret key for JWT token generation (deprecated, kept for backward compatibility)

  JWTExpiration:
    Type: String
    Default: '24h'
    Description: JWT token expiration time (deprecated, kept for backward compatibility)

  TablePrefix:
    Type: String
    Default: cloud-exam-platform
    Description: Prefix for DynamoDB table names

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for authentication

  CognitoClientId:
    Type: String
    Description: Cognito App Client ID

  WebhookApiKey:
    Type: String
    NoEcho: true
    Description: API key for webhook endpoints (Apps Script integration)

Resources:
  # API Gateway
  CloudExamApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      BinaryMediaTypes:
        - "multipart/form-data"
        - "image/*"
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
            Identity:
              Header: Authorization
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # Authentication Functions
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.login
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref CloudExamApi
            Path: /auth/login
            Method: POST
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-users'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminListGroupsForUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.logout
      Events:
        LogoutApi:
          Type: Api
          Properties:
            RestApiId: !Ref CloudExamApi
            Path: /auth/logout
            Method: POST

  GetCurrentUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.getCurrentUser
      Events:
        GetCurrentUserApi:
          Type: Api
          Properties:
            RestApiId: !Ref CloudExamApi
            Path: /auth/me
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-users'
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-students'

  # Operator Functions
  CreateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.createStudent
      Events:
        CreateStudentApi:
          Type: Api
          Properties:
