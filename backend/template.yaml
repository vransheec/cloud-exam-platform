  # Webhook Function (public via Function URL, API key auth in code)
  WebhookSaleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.webhookSale
      Timeout: 30
      Environment:
        Variables:
          WEBHOOK_API_KEY: !Ref WebhookApiKey
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
            - x-api-key
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${TablePrefix}-enrollments'
        - DynamoDBReadPolicy:
            TableName: !Sub '${TablePrefix}-courses'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminEnableUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  WebhookSaleFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WebhookSaleFunction}'
      RetentionInDays: 7

  # Cognito Post Confirmation Trigger (auto-assign students group)
  PostConfirmationTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.postConfirmationTrigger
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminListGroupsForUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # Cognito Pre Sign Up Trigger (auto-link Google accounts + auto-confirm)
  PreSignUpTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.preSignUpTrigger
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminLinkProviderForUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # Batch Spanish Translation Function (operator-invoked, one-time pre-translation)
  # Translates every non-SOA/DEA question + alternative to Spanish and caches in the _es
  # fields on the existing DynamoDB records. Idempotent (Property 10).
  # Feature: exam-spanish-translation, Requirements 9.*, 14.3
  BatchTranslateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.batchTranslate
      MemorySize: 3008
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub '${TablePrefix}-questions'
        - DynamoDBCrudPolicy:
            TableName: !Sub '${TablePrefix}-alternatives'
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-questions/index/*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-alternatives/index/*'
        # Amazon Translate permissions (Req 14.1, 14.2, 14.3). No wildcard action (Req 14.4).
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
                - translate:GetTerminology
                - translate:ListTerminologies
              Resource: '*'

  # S3 Bucket for Images (Public Read with CORS)
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${TablePrefix}-images-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000

# Outputs
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${CloudExamApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ImageBucketName:
    Description: S3 bucket name for images
    Value: !Ref ImageBucket
    Export:
      Name: !Sub '${AWS::StackName}-ImageBucket'

  ImageBucketUrl:
    Description: S3 bucket URL for images
    Value: !GetAtt ImageBucket.WebsiteURL
    Export:
      Name: !Sub '${AWS::StackName}-ImageBucketUrl'
