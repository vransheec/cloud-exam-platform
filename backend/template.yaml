  ResetStudentPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.resetStudentPassword
      Events:
        ResetStudentPasswordApi:
          Type: Api
          Properties:
