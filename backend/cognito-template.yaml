AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud Exam Platform - Cognito User Pool

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'cloud-exam-platform-${Environment}'
      
      # Sign-in options
      UsernameAttributes:
        - email
      
      # Password policy
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      
      # Account recovery
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      
      # Email configuration
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      
      # Auto-verified attributes
      AutoVerifiedAttributes:
        - email
      
      # User attributes
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      
      # Advanced security (optional - costs extra)
      # UserPoolAddOns:
      #   AdvancedSecurityMode: ENFORCED  # Enables CAPTCHA and risk detection
      
      # Account takeover protection
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      
      # MFA configuration (optional)
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      
      # Device tracking
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: true
      
      # Tags
      UserPoolTags:
        Environment: !Ref Environment
        Application: cloud-exam-platform

  # User Pool Client (for frontend)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'cloud-exam-platform-client-${Environment}'
      UserPoolId: !Ref UserPool
      
      # Auth flows
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      
      # Token validity
      AccessTokenValidity: 1  # 1 hour
      IdTokenValidity: 1      # 1 hour
      RefreshTokenValidity: 30 # 30 days
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      
      # Prevent user existence errors
      PreventUserExistenceErrors: ENABLED
      
      # Read/write attributes
      ReadAttributes:
        - email
        - name
      WriteAttributes:
        - email
        - name

  # User Pool Domain (for hosted UI - optional)
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'cloud-exam-platform-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # Operator Group
  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operators
      Description: Operator users with full system access
      UserPoolId: !Ref UserPool
      Precedence: 1

  # Assistant Group
  AssistantGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: assistants
      Description: Assistant users who can create questions and students
      UserPoolId: !Ref UserPool
      Precedence: 2

  # Student Group
  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: students
      Description: Student users who can take exams
      UserPoolId: !Ref UserPool
      Precedence: 3

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'

  CognitoHostedUIUrl:
    Description: Cognito Hosted UI URL (optional)
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-HostedUIUrl'
